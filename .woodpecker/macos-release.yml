when:
  - event: release
  - event: tag

labels:
  platform: darwin/arm64
  backend: local

steps:
  build-macos-arm64:
    image: bash
    environment:
      SSL_CERT_FILE: /etc/ssl/cert.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/cert.pem
    commands:
      - |
        set -eu
        test -n "${CI_COMMIT_TAG:-}"
        VERSION="${CI_COMMIT_TAG#v}"
        export SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION"
        command -v uv
        command -v zstd
        uv python install cpython-3.13-macos-aarch64-none
        ARM64_PYTHON="$(uv python find cpython-3.13-macos-aarch64-none)"
        scripts/macos/make-iconset.sh
        ARCH=arm64 VERSION="$VERSION" PYTHON_BIN="$ARM64_PYTHON" scripts/macos/make-runtime-pack.sh
        ARCH=arm64 VERSION="$VERSION" scripts/macos/make-app.sh
        ARCH=arm64 VERSION="$VERSION" scripts/macos/make-dmg.sh

  inspect-macos-artifacts:
    image: bash
    depends_on:
      - build-macos-arm64
    commands:
      - |
        set -eu
        test -f .build/macos-dist/LayerLab-macOS-arm64.dmg
        test -f .build/LayerLab-runtime-macOS-arm64.tar.zst
        test -f .build/macos-dist/SHA256SUMS-macOS-arm64.txt
        hdiutil verify .build/macos-dist/LayerLab-macOS-arm64.dmg
        mountpoint="$(mktemp -d /tmp/layerlab-dmg.XXXXXX)"
        hdiutil attach .build/macos-dist/LayerLab-macOS-arm64.dmg -readonly -nobrowse -mountpoint "$mountpoint"
        trap 'hdiutil detach "$mountpoint"; rmdir "$mountpoint"' EXIT
        test -d "$mountpoint/LayerLab.app"
        test -L "$mountpoint/Applications"
        codesign --verify --deep --strict "$mountpoint/LayerLab.app"
        for name in LICENSE NOTICE THIRD_PARTY_NOTICES.txt THIRD_PARTY_LICENSES.txt THIRD_PARTY_INVENTORY.json; do
          test -f "$mountpoint/$name"
          cmp "$mountpoint/$name" "$mountpoint/LayerLab.app/Contents/Resources/$name"
        done
        test -f "$mountpoint/LayerLab.app/Contents/Resources/BUILD_PROVENANCE.json"
        test -f "$mountpoint/LayerLab.app/Contents/Resources/DEPENDENCY_AUDIT.json"

  upload-macos-artifacts:
    image: bash
    when:
      - event: release
    depends_on:
      - inspect-macos-artifacts
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - |
        set -eu
        test -n "${CI_COMMIT_TAG:-}"
        RELEASE_REPO="${CI_REPO:-bassmicrobe/stemdeck}"
        # A release label alone is not a successful security gate.
        successful_run="$(gh run list --repo "$RELEASE_REPO" --commit "$CI_COMMIT_SHA" --workflow ci.yml --status success --json databaseId --jq '.[0].databaseId // empty')"
        test -n "$successful_run"
        gh release edit "$CI_COMMIT_TAG" --repo "$RELEASE_REPO" --prerelease --latest=false
        gh release upload "$CI_COMMIT_TAG" \
          .build/macos-dist/LayerLab-macOS-arm64.dmg \
          .build/LayerLab-runtime-macOS-arm64.tar.zst \
          .build/macos-dist/SHA256SUMS-macOS-arm64.txt \
          .build/BUILD_PROVENANCE-macOS-arm64.json \
          .build/DEPENDENCY_AUDIT-macOS-arm64.json \
          --repo "$RELEASE_REPO"
